# Review compute/storage charges before applying this Blueprint. No development adapters or seeds.
services:
  - type: web
    name: cravecart-gateway
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./infra/docker/Dockerfile
    dockerContext: .
    dockerCommand: node apps/gateway/dist/index.js
    numInstances: 1
    healthCheckPath: /health/live
    envVars:
      - fromGroup: cravecart-hosted
      - key: CLAMD_HOST
        fromService:
          name: cravecart-scanner
          type: pserv
          property: host
      - key: SERVICE_NAME
        value: gateway
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: AUTH_HOSTPORT
        fromService:
          name: cravecart-auth
          type: pserv
          property: hostport
      - key: RESTAURANT_HOSTPORT
        fromService:
          name: cravecart-restaurant
          type: pserv
          property: hostport
      - key: RIDER_HOSTPORT
        fromService:
          name: cravecart-rider
          type: pserv
          property: hostport
      - key: ADMIN_HOSTPORT
        fromService:
          name: cravecart-admin
          type: pserv
          property: hostport
      - key: REALTIME_HOSTPORT
        fromService:
          name: cravecart-realtime
          type: web
          property: hostport
      - key: UTILS_HOSTPORT
        fromService:
          name: cravecart-utils
          type: pserv
