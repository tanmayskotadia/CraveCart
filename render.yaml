    disk:
      name: private-uploads
      mountPath: /var/lib/cravecart/uploads
      sizeGB: 5
  - type: pserv
    name: cravecart-scanner
    runtime: image
    image:
      url: docker.io/clamav/clamav:stable
    region: singapore
    plan: 1c-2g
    disk:
      name: scanner-signatures
      mountPath: /var/lib/clamav
      sizeGB: 1
envVarGroups:
  - name: cravecart-hosted
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEV_ADAPTERS
        value: 'false'
      - key: COMMERCE_MODE
        value: test
      - key: PAYMENT_LIVE_CONFIRMED
        value: 'false'
      - key: FINANCE_DUAL_APPROVAL_THRESHOLD_MINOR
        value: '0'
      - key: MONGO_DB_PREFIX
        value: cravecart_staging
      - key: UPLOAD_SCAN_MODE
        value: clamav
      - key: UPLOAD_DIRECTORY
        value: /var/lib/cravecart/uploads
      - key: INTERNAL_TOKEN
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_ENCRYPTION_KEY
        generateValue: true
      - key: UPLOAD_ENCRYPTION_KEY
        generateValue: true
      - key: APP_ORIGIN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SMTP_URL
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_ACCOUNT_ID
        sync: false
      - key: CLAMD_PORT
        value: 3310
